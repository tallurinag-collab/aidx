apiVersion: v1
kind: Namespace
metadata:
  name: aidx-dev
  labels:
    app.kubernetes.io/part-of: aidx
    environment: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aidx
  namespace: aidx-dev
  labels:
    app.kubernetes.io/name: aidx
    environment: dev
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: aidx
      environment: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aidx
        environment: dev
    spec:
      containers:
        - name: aidx
          image: myregistry.azurecr.io/aidx:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aidx
  namespace: aidx-dev
  labels:
    app.kubernetes.io/name: aidx
    environment: dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aidx
    environment: dev
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
